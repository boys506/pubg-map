<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>PUBG 战术地图 · 离线版</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <canvas id="map"></canvas>

  <header id="topbar">
    <div class="brand">PUBG 战术地图<span class="ver">离线版</span></div>
    <div class="top-actions">
      <button id="btn-grid" class="icon-btn" title="网格">▦</button>
      <button id="btn-about" class="icon-btn" title="关于">?</button>
    </div>
  </header>

  <div id="readout"></div>

  <div id="rightbar">
    <button id="btn-zoom-in" class="vbtn">＋</button>
    <button id="btn-zoom-out" class="vbtn">－</button>
    <button id="btn-reset" class="vbtn small">⤾</button>
  </div>

  <div id="scalebar"><span id="scale-label"></span><i></i></div>
  <div id="attrib">点位数据 © PUBG.PLUS</div>

  <div id="measurebar" class="hidden">
    <div class="m-stats">
      <div class="m-total"><b id="m-total">0</b> m <em>总距离</em></div>
      <div class="m-sub" id="m-sub">点击地图添加测距点</div>
    </div>
    <div class="m-tools">
      <button id="m-undo">撤销</button>
      <button id="m-clear">清空</button>
      <button id="m-mortar">迫击炮</button>
    </div>
  </div>

  <div id="bottombar">
    <div id="mapchips"></div>
    <div class="bb-actions">
      <button id="btn-types" class="pill">点位筛选 <span id="type-count"></span></button>
      <button id="btn-mode" class="pill primary">测距</button>
    </div>
  </div>

  <!-- 点位筛选 -->
  <section id="sheet-types" class="sheet">
    <div class="sheet-head">
      <h3>点位筛选</h3>
      <div class="sheet-quick">
        <button data-preset="all">全选</button>
        <button data-preset="none">清空</button>
        <button data-preset="key">密室/载具</button>
      </div>
      <button class="sheet-close">✕</button>
    </div>
    <div class="sheet-body" id="type-list"></div>
  </section>

  <!-- 迫击炮 -->
  <section id="sheet-mortar" class="sheet">
    <div class="sheet-head">
      <h3>迫击炮计算</h3>
      <button class="sheet-close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="elev-row">
        <label for="elev">高差（米）</label>
        <input id="elev" type="number" inputmode="numeric" step="1" value="0">
        <div class="elev-quick">
          <button data-elev="-20">-20</button><button data-elev="-10">-10</button>
          <button data-elev="0">0</button><button data-elev="10">10</button><button data-elev="20">20</button>
        </div>
      </div>
      <div id="mortar-out" class="mortar-out"><div class="hint">先在地图上标两个点</div></div>
      <p class="fine">按 PUBG 迫击炮弹道模型解算（最大水平射程 700 m）。地形高差需手动填写，起点在低处填正数、在高处填负数。</p>
    </div>
  </section>

  <!-- 关于 -->
  <section id="sheet-about" class="sheet">
    <div class="sheet-head">
      <h3>关于</h3>
      <button class="sheet-close">✕</button>
    </div>
    <div class="sheet-body about">
      <p><b>PUBG 战术地图 · 离线版</b><br>地图测距 + 点位查询，无需网络。</p>
      <ul>
        <li>地图瓦片、点位数据来源：<b>PUBG.PLUS</b>（pubg.plus），版权归原作者所有。</li>
        <li>点位数据随游戏版本更新可能变化，仅供战术参考。</li>
        <li>地图与游戏素材版权归 KRAFTON / PUBG 所有，本工具为非官方离线工具。</li>
      </ul>
      <p class="fine">数据版本：<span id="data-ver"></span></p>
    </div>
  </section>

  <div id="marker-pop" class="pop hidden"></div>
  <div id="toast"></div>
</div>
<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
